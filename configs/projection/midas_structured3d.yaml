# MiDaS DPT-Hybrid on Structured3D (ERP 512x1024, depth png / 1000 = metres).
# Data: structured3d/structured3d/{rgb,depth}; test_s3250.txt = standard test split (scenes 03250-03499),
# test.txt = all 300 extracted panoramas.

seed: 0
output_dir: results/midas_dpt_hybrid_structured3d

model:
  name: midas
  model_type: dpt_hybrid_384
  weights: weights/dpt_hybrid_384.pt
  device: auto
  erp_net_height: 384

tangent_model: null

dataset:
  name: structured3d            # preset: depth_scale=1000, min 0.1 m, max 10 m
  root: data/structured3d
  list: test_s3250.txt
  height: 512
  width: 1024
  limit: null

evaluation:
  eval_align: auto              # affine-in-disparity for MiDaS
  align_regions: [all, equatorial]
  bands: [0, 15, 30, 45, 60, 75, 90]
  bad_threshold: 0.10
  profile_bin: 2.5
  max_depth: 10.0

inference:
  batch_size: 4
  tangent_size: 384
  polar_threshold: 45
  views_per_pole: 1
  rotation_angles: [[0, 90, 0], [0, -90, 0]]
  fusion_method: cosine
  merge: prior
  align: auto
  band: 20
  power: 2.0
  seam_width: 20

experiments:
  thresholds: [30, 45, 60, 75]
  views_per_pole: [1, 2, 3, 5]
  fusions: [hard, linear, sigmoid, cosine, polynomial, confidence]
  merge_modes: [prior, mean, median]
  rotation_sets:
    pitch90: [[0, 90, 0]]
    pitch90_pm: [[0, 90, 0], [0, -90, 0]]
    pitch90_x4: [[0, 90, 0], [0, -90, 0], [90, 90, 0], [90, -90, 0]]
    pitch45_pm: [[0, 45, 0], [0, -45, 0]]
    yaw_only_x3: [[90, 0, 0], [180, 0, 0], [270, 0, 0]]
  latitude_control_pitches: [0, 30, 60, 90]
  resolutions: [[256, 512], [384, 768], [512, 1024]]
  resolution_limit: 12
  timing_images: 3
  qualitative: 4
