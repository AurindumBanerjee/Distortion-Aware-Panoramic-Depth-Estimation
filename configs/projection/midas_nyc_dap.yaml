# Experiment: MiDaS DPT-Hybrid on real-world NYC outdoor panoramas (DAP dataset).
# This is the FIRST real-data experiment for this repo.
# Depth GT: float64 .npy files in metres (Euclidean range).
# RGB: 1024x2048 equirectangular PNG panoramas.

seed: 0
output_dir: results/midas_dpt_hybrid_nyc

model:
  name: midas
  model_type: dpt_hybrid_384
  weights: weights/dpt_hybrid_384.pt
  device: auto
  erp_net_height: 384     # MiDaS runs the 2:1 ERP at 384 x 768

tangent_model: null

dataset:
  name: nyc_dap
  root: data/nyc_dap
  list: test.txt
  height: 512
  width: 1024
  limit: 24               # start with 24 images (same as synthetic); set to null for all 1908

evaluation:
  eval_align: auto        # affine-in-disparity for MiDaS
  align_regions: [all, equatorial]
  bands: [0, 15, 30, 45, 60, 75, 90]
  bad_threshold: 0.10
  profile_bin: 2.5
  max_depth: 1000.0       # outdoor scenes: GT goes up to ~974m

inference:
  batch_size: 4
  tangent_size: 384
  polar_threshold: 45
  views_per_pole: 1
  rotation_angles: [[0, 90, 0], [0, -90, 0]]
  fusion_method: cosine
  merge: prior
  align: auto
  band: 20
  power: 2.0
  seam_width: 20

experiments:
  thresholds: [30, 45, 60, 75]
  views_per_pole: [1, 2, 3, 5]
  fusions: [hard, linear, sigmoid, cosine, polynomial, confidence]
  merge_modes: [prior, mean, median]
  rotation_sets:
    pitch90: [[0, 90, 0]]
    pitch90_pm: [[0, 90, 0], [0, -90, 0]]
    pitch90_x4: [[0, 90, 0], [0, -90, 0], [90, 90, 0], [90, -90, 0]]
    pitch45_pm: [[0, 45, 0], [0, -45, 0]]
    yaw_only_x3: [[90, 0, 0], [180, 0, 0], [270, 0, 0]]
  latitude_control_pitches: [0, 30, 60, 90]
  resolutions: [[256, 512], [384, 768], [512, 1024]]
  resolution_limit: 12
  timing_images: 3
  qualitative: 4
