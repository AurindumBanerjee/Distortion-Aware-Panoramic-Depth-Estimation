# Cross-dataset validation of Experiment 05 on Holo360D indoor.
# FOV is the only changed inference variable: fixed 256x256 tangent views.
# Keep model, threshold, fusion, band, power, alignment and protocols identical to Exp05.
seed: 53
output_dir: artifacts/results/followups/fov_resolution_sweep/outputs_holo360d_indoor
model:
  name: midas
  model_type: dpt_hybrid_384
  weights: "{ENV:MIDAS_WEIGHTS|weights/dpt_hybrid_384.pt}"
  device: cuda
  erp_net_height: 384
dataset:
  name: holo360d
  root: "{ENV:HOLO360D_ROOT|data/holo360d}"
  list: indoor.txt
  height: 512
  width: 1024
  max_scenes: null
  depth_scale: 1.0
  min_depth: 0.1
  max_depth: 10.0
  exr_scale: 1.0
inference:
  fov_degrees: [70, 90, 110, 130]
  tangent_resolutions: [256]
  polar_threshold: 45
  views_per_pole: 1
  fusion: cosine
  band: 20
  power: 2.0
  align: affine
  batch_size: 4
evaluation:
  protocols: [align-all, align-equatorial]
  min_depth: 0.1
  max_depth: 10.0
