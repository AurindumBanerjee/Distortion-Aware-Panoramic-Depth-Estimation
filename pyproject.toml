[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pano-distortion-depth"
version = "0.1.0"
description = "Distortion-Aware Panoramic Depth Estimation: Measurement Study and Inference-Time Corrections for Frozen Models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Aurindum Banerjee" },
    { name = "Harshita Vachhani" },
    { name = "Lokesh Motwani" },
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.9.3",
    "pyyaml>=6.0",
    "scikit-image>=0.21",
    "tabulate>=0.9",
    "timm==0.6.13",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.40",
    "altair>=5.0",
    "jinja2>=3.1.2",
]
dev = [
    "pytest>=7.4",
    "nbformat>=5.9",
    "nbconvert>=7.0",
    "ipykernel>=6.25",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pano*", "methods*", "experiments*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_artifacts: marks tests that read precomputed result artifacts under artifacts/",
]
