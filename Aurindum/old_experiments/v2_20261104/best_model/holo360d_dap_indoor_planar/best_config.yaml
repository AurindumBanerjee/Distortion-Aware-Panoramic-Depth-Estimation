benchmark_suffix: _dap_indoor_planar
data:
  dataset: holo360d
  height: 512
  list: indoor.txt
  max_scenes: null
  root: data/holo360d
  width: 1024
evaluation:
  log_dir: logs_dap_holo360d_indoor_planar
  max_depth: 10.0
  methods:
  - Method1_PlanarPrior
  min_depth: 0.1
  output_dir: outputs_dap_holo360d_indoor_planar
  protocols:
  - none
  - align-all
method1:
  anchor_max_lat: 60.0
  blend_margin: 10.0
  fov_deg: 90.0
  phi_threshold: 45.0
  polar_source: auto
  resolution: 384
  texture_gate_mode: erp
  texture_tau: 0.0
method_name: Structured3D Real Foundation Benchmark (DAP)
mobius_tta:
  anchor_max_lat: 30.0
  fusion_mode: distortion_weighted
  gate_lat:
  - 30
  - 55
  passes:
  - pitch: 90.0
    scale: 1.0
  - pitch: -90.0
    scale: 1.0
  - pitch: 0.0
    scale: 1.6
  - pitch: 0.0
    scale: 0.625
  reanchor: auto
model:
  device: auto
  name: dap
  repo: third_party/DAP
  scale: metric
  space: depth
  weights: weights/dap/model.pth
