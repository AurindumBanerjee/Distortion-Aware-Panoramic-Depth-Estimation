# Benchmark Configuration on Real Structured3D Panoramas
method_name: "Structured3D Real Foundation Benchmark"
model:
  name: "dpt_hybrid_384"
  device: "auto"
  space: "disparity"
  scale: "affine"

data:
  # Relative path inside Aurindum repo on the server
  root: "data/structured3d"
  max_scenes: 10
  height: 256
  width: 512

evaluation:
  align_protocol: "align-equatorial"
  output_dir: "outputs"
  log_dir: "logs"
