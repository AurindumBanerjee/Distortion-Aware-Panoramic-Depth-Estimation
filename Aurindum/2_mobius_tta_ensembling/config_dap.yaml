# DAP (Depth Any Panoramas) variant of config.yaml: metric depth model at its native 512x1024.
# Run via CONFIG=config_dap.yaml or the master script (normal config first, then this one).
# Method 2 Configuration: Test-Time Möbius Augmentation & Equator-to-Pole Ensembling
method_name: "Mobius TTA Ensembling (DAP)"
benchmark_suffix: "_dap"   # keeps DAP results in their own best_model/ registry
model:
  name: "dap"
  repo: "third_party/DAP"
  weights: "weights/dap/model.pth"
  device: "auto"
  space: "depth"
  scale: "metric"

mobius_tta:
  # Each pass = conformal Möbius map: rotation (pitch, deg) then stereographic dilation (scale).
  # A pure dilation fixes both poles, so only pitch = +/-90 passes show the poles to the model
  # at the equator. Identity is added automatically. Legacy `scales: [...]` still works.
  passes:
    - {pitch: 90.0, scale: 1.0}    # north pole -> image centre
    - {pitch: -90.0, scale: 1.0}   # south pole -> image centre
    - {pitch: 0.0, scale: 1.6}     # pure dilations (ablation: drop these to isolate the rotation effect)
    - {pitch: 0.0, scale: 0.625}
  fusion_mode: "distortion_weighted"  # 'distortion_weighted', 'median', 'mean'
  reanchor: "auto"       # affine (disparity models) | scale | none (metric models, e.g. DAP) | auto
  gate_lat: [30, 55]   # non-identity passes fade in between |lat| 30 and 55 deg; output == baseline below 30 (protects the equator)
  anchor_max_lat: 30.0   # re-anchor each pass to the identity pass on pixels low-latitude in both frames

evaluation:
  num_scenes: 6
  height: 512
  width: 1024
  # First protocol is the headline. 'align-all' = standard (fit on all valid pixels);
  # 'align-equatorial' = fit on |phi| < 30 only (tests polar consistency, stricter).
  protocols: ["none", "align-all"]   # metric model: raw metres headline, global median scale second
  min_depth: 0.05   # aligned predictions are clamped to the GT range
  max_depth: 50.0
  output_dir: "outputs_dap"
  log_dir: "logs_dap"
