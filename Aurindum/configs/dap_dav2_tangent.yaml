# DAP for ERP / rotated passes + Depth Anything V2 metric-indoor (perspective, z-depth) for tangent views.
seed: 0
output_dir: results/dap_dav2tangent_stanford2d3d
model: {name: dap, repo: third_party/DAP, weights: weights/dap/model.pth, device: auto,
  height: 512, width: 1024, imagenet_normalize: true, perspective_geometry: range}
tangent_model: {name: dav2, hf_id: depth-anything/Depth-Anything-V2-Metric-Indoor-Large-hf,
  device: auto}
dataset: {name: stanford2d3d, root: data/stanford2d3d, list: test_area5.txt, height: 512,
  width: 1024, limit: null}
evaluation:
  eval_align: none
  align_regions: [all]
  bands: [0, 15, 30, 45, 60, 75, 90]
  bad_threshold: 0.1
  profile_bin: 2.5
  max_depth: 16.0
inference:
  batch_size: 4
  tangent_size: 512
  polar_threshold: 45
  views_per_pole: 1
  rotation_angles:
  - [0, 90, 0]
  - [0, -90, 0]
  fusion_method: cosine
  merge: prior
  align: scale
  band: 20
  power: 2.0
experiments:
  thresholds: [30, 45, 60, 75]
  views_per_pole: [1, 2, 3, 5]
  fusions: [hard, linear, sigmoid, cosine, polynomial, confidence]
  merge_modes: [prior, mean, median]
  rotation_sets:
    pitch90:
    - [0, 90, 0]
    pitch90_pm:
    - [0, 90, 0]
    - [0, -90, 0]
    pitch90_x4:
    - [0, 90, 0]
    - [0, -90, 0]
    - [90, 90, 0]
    - [90, -90, 0]
    pitch45_pm:
    - [0, 45, 0]
    - [0, -45, 0]
    yaw_only_x3:
    - [90, 0, 0]
    - [180, 0, 0]
    - [270, 0, 0]
  latitude_control_pitches: [0, 30, 60, 90]
  control_limit: 100
  resolutions:
  - [256, 512]
  - [512, 1024]
  resolution_limit: 100
  timing_images: 10
  qualitative: 6
