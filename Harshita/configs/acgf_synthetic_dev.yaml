# ACGF development set: 8 procedurally rendered panoramas (seed 101, disjoint from the seed-0 synthetic
# test set). ACGF's free parameters were chosen here, never on Structured3D / Holo360D.
#   python -m datasets.synthetic --out data/synthetic_dev --n 8 --seed 101
#   python run_experiment.py --config configs/acgf_synthetic_dev.yaml --tags E1_baseline E4_hybrid E10_acgf E10_acgf_ablation

seed: 0
output_dir: results/acgf_midas_synthetic_dev

model:
  name: midas
  model_type: dpt_hybrid_384
  weights: weights/dpt_hybrid_384.pt
  device: auto
  erp_net_height: 384

tangent_model: null

dataset:
  name: synthetic
  root: data/synthetic_dev
  list: test.txt
  height: 512
  width: 1024
  limit: null

evaluation:
  eval_align: auto              # affine-in-disparity for MiDaS
  align_regions: [all, equatorial]
  bands: [0, 15, 30, 45, 60, 75, 90]
  bad_threshold: 0.10
  profile_bin: 2.5
  max_depth: 100.0

inference:
  batch_size: 4
  tangent_size: 384
  polar_threshold: 45
  views_per_pole: 1
  rotation_angles: [[0, 90, 0], [0, -90, 0]]
  fusion_method: cosine
  merge: prior
  align: auto
  band: 20
  power: 2.0
  seam_width: 20
  range_guard: true             # tangent / rotation / hybrid: drop aligned values outside the baseline's plausible range
  acgf:                         # Anchored Conformal Gradient Fusion (inference/conformal_fusion.py); set on data/synthetic_dev only
    views: [[stereo, 180, 0], [gnomonic, 110, 45]]   # [kind, fov_deg, orientation about the polar axis]
    screen: value
    lambda_cap: 5.0                 # chosen on data/synthetic_dev (sweep 0.2 / 1 / 5)
    lambda_edge: 50.0
    gate_sigma: 3.0
    irls: 1
    law: "off"                    # stereographic magnification correction; off: it hurt on the dev set (ablation acgf|law)

experiments:
  thresholds: [30, 45, 60, 75]
  mono360: true                 # E11: 360MonoDepth-style baseline (20 icosahedral views; disparity models only)
  views_per_pole: [1, 2, 3, 5]
  fusions: [hard, linear, sigmoid, cosine, polynomial, confidence]
  merge_modes: [prior, mean, median]
  rotation_sets:
    pitch90: [[0, 90, 0]]
    pitch90_pm: [[0, 90, 0], [0, -90, 0]]
    pitch90_x4: [[0, 90, 0], [0, -90, 0], [90, 90, 0], [90, -90, 0]]
    pitch45_pm: [[0, 45, 0], [0, -45, 0]]
    yaw_only_x3: [[90, 0, 0], [180, 0, 0], [270, 0, 0]]
  latitude_control_pitches: [0, 30, 60, 90]
  resolutions: [[256, 512], [384, 768], [512, 1024]]
  resolution_limit: 12
  timing_images: 3
  qualitative: 4
