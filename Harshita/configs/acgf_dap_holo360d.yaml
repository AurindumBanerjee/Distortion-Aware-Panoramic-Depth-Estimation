# ACGF with the target panoramic model DAP (metric range) on Holo360D. Needs a GPU, the DAP repo and weights:
#   git clone https://github.com/Insta360-Research-Team/DAP third_party/DAP  (+ pip install -r its requirements)
#   weights: https://huggingface.co/Insta360-Research/DAP-weights -> weights/dap/model.pth
# For a metric model ACGF needs no view alignment at all (log-gradients are scale-free).
#   python run_experiment.py --config configs/acgf_dap_holo360d.yaml --set dataset.list=test_indoor.txt
#       output_dir=results/acgf_dap_holo360d_indoor --tags E1_baseline E2_tangent E3_rotation E4_hybrid E10_acgf E10_acgf_ablation

seed: 0
output_dir: results/acgf_dap_holo360d

model:
  name: dap
  repo: third_party/DAP
  weights: weights/dap/model.pth
  device: auto
  height: 512
  width: 1024
  imagenet_normalize: true      # follows DAP test/eval.py
  perspective_geometry: range   # unknown for pinhole inputs; ACGF uses only log-gradients, so a global factor cancels

tangent_model: null

dataset:
  name: holo360d                # preset: EXR metres, min 0.1 m, max 100 m; 3rd list column = mask
  root: data/holo360d
  list: test.txt                # or test_indoor.txt (146) / test_outdoor.txt (83)
  height: 512
  width: 1024
  limit: null

evaluation:
  eval_align: none              # DAP is metric; also run with --set evaluation.eval_align=median
  align_regions: [all]
  bands: [0, 15, 30, 45, 60, 75, 90]
  bad_threshold: 0.10
  profile_bin: 2.5
  max_depth: 100.0

inference:
  batch_size: 4
  tangent_size: 384
  polar_threshold: 45
  views_per_pole: 1
  rotation_angles: [[0, 90, 0], [0, -90, 0]]
  fusion_method: cosine
  merge: prior
  align: auto
  band: 20
  power: 2.0
  seam_width: 20
  range_guard: true             # tangent / rotation / hybrid: drop aligned values outside the baseline's plausible range
  acgf:                         # Anchored Conformal Gradient Fusion (inference/conformal_fusion.py); set on data/synthetic_dev only
    views: [[stereo, 180, 0], [gnomonic, 110, 45]]   # [kind, fov_deg, orientation about the polar axis]
    screen: value
    lambda_cap: 5.0                 # chosen on data/synthetic_dev (sweep 0.2 / 1 / 5)
    lambda_edge: 50.0
    gate_sigma: 3.0
    irls: 1
    law: "off"                    # stereographic magnification correction; off: it hurt on the dev set (ablation acgf|law)

experiments:
  thresholds: [30, 45, 60, 75]
  mono360: false                # defined for disparity models only
  views_per_pole: [1, 2, 3, 5]
  fusions: [hard, linear, sigmoid, cosine, polynomial, confidence]
  merge_modes: [prior, mean, median]
  rotation_sets:
    pitch90: [[0, 90, 0]]
    pitch90_pm: [[0, 90, 0], [0, -90, 0]]
    pitch90_x4: [[0, 90, 0], [0, -90, 0], [90, 90, 0], [90, -90, 0]]
    pitch45_pm: [[0, 45, 0], [0, -45, 0]]
    yaw_only_x3: [[90, 0, 0], [180, 0, 0], [270, 0, 0]]
  latitude_control_pitches: [0, 30, 60, 90]
  resolutions: [[256, 512], [384, 768], [512, 1024]]
  resolution_limit: 12
  timing_images: 3
  qualitative: 4
