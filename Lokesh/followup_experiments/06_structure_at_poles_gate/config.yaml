seed: 23
output_dir: followup_experiments/06_structure_at_poles_gate/outputs
model:
  name: da360
  repo: "{ENV:DA360_REPO|third_party/DA360}"
  weights: "{ENV:DA360_WEIGHTS|weights/da360/DA360_large.pth}"
  device: cuda
dataset:
  name: panox
  root: "{ENV:PANOX_ROOT|../../panox/panox}"
  list: test.txt
  height: 512
  width: 1024
  max_scenes: 200
inference:
  # Single fixed correction method applied only where the gate allows it.
  # Uses the same two-pole rotation correction as experiments 02/04 so results
  # are comparable; the gate decides per-scene per-pole whether to use it.
  rotations: [[0, 90, 0], [0, -90, 0]]
  fusion: cosine
  band: 20
  power: 2.0
  align_views: scale
evaluation:
  alignment: scale
  protocol: align-all
  min_depth: 0.05
  max_depth: 100.0
gate:
  score_band: [75, 90]
  # start from gate.py's module-level defaults; override here once
  # calibrate_thresholds() has been run on a held-out slice, e.g.:
  # flat_sky_gradient_pctl: 10
  # missing_coverage_frac: 0.05
