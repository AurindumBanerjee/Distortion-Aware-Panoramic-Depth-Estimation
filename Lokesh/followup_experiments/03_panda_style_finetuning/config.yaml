seed: 31
output_dir: followup_experiments/03_panda_style_finetuning/outputs
teacher:
  name: da360
  repo: "{ENV:DA360_REPO|third_party/DA360}"
  weights: "{ENV:DA360_WEIGHTS|weights/da360/DA360_large.pth}"
  device: cuda
dataset:
  name: panox
  root: "{ENV:PANOX_ROOT|../../panox/panox}"
  list: test.txt
  image_glob: "**/rgb/*.png"
  height: 256
  width: 512
  max_images: 200
training:
  epochs: 20
  batch_size: 4
  learning_rate: 0.0002
  weight_decay: 0.00001
  workers: 4
  amp: true
  patch_grid: 8
  patch_normalization_weight: 0.5
  gradient_loss_weight: 0.1
  train_group_fraction: 0.75
  cache_teacher_predictions: true
  save_every: 1
evaluation:
  min_depth: 0.05
  max_depth: 100.0
  protocols: [align-all, align-equatorial]
  student_alignment: affine
  teacher_alignment: scale
  max_eval_images: 200
