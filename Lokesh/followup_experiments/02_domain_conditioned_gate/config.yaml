seed: 23
output_dir: followup_experiments/02_domain_conditioned_gate/outputs
model:
  name: da360
  repo: "{ENV:DA360_REPO|third_party/DA360}"
  weights: "{ENV:DA360_WEIGHTS|weights/da360/DA360_large.pth}"
  device: cuda
dataset:
  name: panox
  root: "{ENV:PANOX_ROOT|../../panox/panox}"
  list: test.txt
  height: 512
  width: 1024
  max_scenes: 200
inference:
  candidate_thresholds: [30, 40, 45, 50, 60, 70]
  rotations: [[0, 90, 0], [0, -90, 0]]
  fusion: cosine
  band: 20
  power: 2.0
  align_views: scale
evaluation:
  alignment: scale
  protocol: align-all
  min_depth: 0.05
  max_depth: 100.0
gate:
  minimum_calibration_gain: 0.005
  score_band: 75-90
  bootstrap_samples: 2000
