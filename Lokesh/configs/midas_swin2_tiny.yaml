# Second model (generalisation): MiDaS v3.1 Swin2-Tiny (fixed 256x256 input; the ERP is squashed, as MiDaS does).
seed: 0
output_dir: results/midas_swin2_tiny_synthetic
model: {name: midas, model_type: dpt_swin2_tiny_256, weights: weights/dpt_swin2_tiny_256.pt,
  device: auto}
tangent_model: null
dataset: {name: synthetic, root: data/synthetic, list: test.txt, height: 512, width: 1024,
  limit: null}
evaluation:
  eval_align: auto
  align_regions: [all, equatorial]
  bands: [0, 15, 30, 45, 60, 75, 90]
  bad_threshold: 0.1
  profile_bin: 2.5
  max_depth: 100.0
inference:
  batch_size: 4
  tangent_size: 256
  polar_threshold: 45
  views_per_pole: 1
  rotation_angles:
  - [0, 90, 0]
  - [0, -90, 0]
  fusion_method: cosine
  merge: prior
  align: auto
  band: 20
  power: 2.0
experiments:
  thresholds: [30, 45, 60, 75]
  views_per_pole: [1, 2, 3, 5]
  fusions: [hard, linear, sigmoid, cosine, polynomial, confidence]
  merge_modes: [prior, mean, median]
  rotation_sets:
    pitch90:
    - [0, 90, 0]
    pitch90_pm:
    - [0, 90, 0]
    - [0, -90, 0]
    pitch90_x4:
    - [0, 90, 0]
    - [0, -90, 0]
    - [90, 90, 0]
    - [90, -90, 0]
    pitch45_pm:
    - [0, 45, 0]
    - [0, -45, 0]
    yaw_only_x3:
    - [90, 0, 0]
    - [180, 0, 0]
    - [270, 0, 0]
  latitude_control_pitches: [0, 30, 60, 90]
  resolutions:
  - [256, 512]
  - [384, 768]
  - [512, 1024]
  resolution_limit: 12
  timing_images: 3
  qualitative: 4
